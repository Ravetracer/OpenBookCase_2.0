framework:
    rate_limiter:
        # Loose limiter for open public-data reads (GET /api/v1/*), keyed by client IP.
        api_read:
            policy: sliding_window
            limit: 600
            interval: '1 minute'
            cache_pool: 'rate_limiter.cache'
        # Tighter limiter for writes (POST/PATCH/DELETE), keyed by the OAuth access token.
        api_write:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            cache_pool: 'rate_limiter.cache'
        # Public "forgot password" requests, keyed by client IP — curbs address
        # enumeration and reset-mail flooding (ResetPasswordController::request).
        password_reset:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: 'rate_limiter.cache'
        # Single-entry views (deep link, short link, detail fragment/JSON), keyed by
        # user id or client IP (IPv6 by /64) — slows down scrapers walking every id
        # while a person browsing the map never gets near it (BookcaseViewRateLimitSubscriber).
        bookcase_view_burst:
            policy: sliding_window
            limit: 40
            interval: '1 minute'
            cache_pool: 'rate_limiter.cache'
        bookcase_view_hourly:
            policy: sliding_window
            limit: 300
            interval: '1 hour'
            cache_pool: 'rate_limiter.cache'
        bookcase_view_daily:
            policy: sliding_window
            limit: 1000
            interval: '1 day'
            cache_pool: 'rate_limiter.cache'
        bookcase_view:
            policy: compound
            limiters: [bookcase_view_burst, bookcase_view_hourly, bookcase_view_daily]
    cache:
        pools:
            # Dedicated, persistent store for limiter state (survives between requests).
            # In tests this is cleared per-test in FunctionalTestCase::setUp (a
            # resettable in-memory adapter would be wiped between sub-requests).
            rate_limiter.cache:
                adapter: cache.adapter.filesystem
